<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Tabbatical</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="masthead">
      <h1>Tabbatical</h1>
      <!-- Shown only in the dropdown, which closes the moment focus leaves it.
           Hidden by default so the docked panel never offers to open itself. -->
      <button id="open-panel" class="row-button row-button--quiet" type="button" hidden>
        Dock to side
      </button>
    </header>

    <nav class="tabs" role="tablist">
      <button id="tab-digest" class="tab" role="tab" aria-selected="true" aria-controls="view-digest">
        Review
      </button>
      <button id="tab-snoozed" class="tab" role="tab" aria-selected="false" aria-controls="view-snoozed">
        Snoozed
      </button>
      <button id="tab-archive" class="tab" role="tab" aria-selected="false" aria-controls="view-archive">
        Archive
      </button>
      <button id="tab-settings" class="tab" role="tab" aria-selected="false" aria-controls="view-settings">
        Settings
      </button>
    </nav>

    <section id="view-digest" role="tabpanel" aria-labelledby="tab-digest">
      <p class="subtitle">Tabs ranked by how stale they are — oldest and least-used first.</p>
      <ul id="digest-list" class="entry-list"></ul>
    </section>

    <section id="view-snoozed" role="tabpanel" aria-labelledby="tab-snoozed" hidden>
      <p class="subtitle">Tabs you've parked, soonest to return first.</p>
      <ul id="snoozed-list" class="entry-list"></ul>
    </section>

    <section id="view-archive" role="tabpanel" aria-labelledby="tab-archive" hidden>
      <p class="subtitle">Everything you've archived, most recent first.</p>
      <input
        id="archive-search"
        class="search-input"
        type="search"
        placeholder="Search titles and page text"
        aria-label="Search the archive"
        autocomplete="off"
        spellcheck="false"
      />
      <ul id="archive-list" class="entry-list"></ul>
    </section>

    <section id="view-settings" role="tabpanel" aria-labelledby="tab-settings" hidden>
      <p class="subtitle">How tabs are scored. Changes re-rank the review list straight away.</p>
      <div id="settings-form"></div>
    </section>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
